[project]
name = "electoral"
version = "0.1.0"
description = "Bayesian poll aggregation and seat projection for the next Spanish general election"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scipy>=1.14",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pymc>=5.20,<6",
    "arviz>=0.20",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "typer>=0.12",
    "tabulate>=0.9",
    "nutpie>=0.13",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
electoral = "electoral.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electoral"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
