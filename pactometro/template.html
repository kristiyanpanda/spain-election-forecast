<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pactómetro 29-N</title>
<style>
body { font-family: Calibri, Carlito, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.45;
       color: #1e2430; background: #fff; max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
</style>
</head>
<body>
<!--PM:START (everything down to PM:END is the widget; electoral.report embeds it in the forecast page)-->
<style>
.pm { --ink:#1e2430; --muted:#5b6473; --line:#c9ced6; --head:#eef1f5; --accent:#1f6fb2; --band:#f7f8fa;
      --good:#1b7f4b; --warn:#a86a00; --bad:#b00020; color: var(--ink); line-height: 1.45; }
.pm, .pm * { box-sizing: border-box; }
.pm h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
.pm .pm-sub { color: var(--muted); margin: 0 0 14px; max-width: 86ch; }
.pm .pm-flag { color: var(--bad); font-weight: 600; font-size: 13px; margin: 0 0 12px; }
.pm.pm-embedded h1, .pm.pm-embedded .pm-flag, .pm.pm-embedded .pm-langbox { display: none; }
.pm .pm-top { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 12px; }
.pm .pm-lab { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.pm .pm-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.pm .pm-seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 6px 12px;
                     cursor: pointer; border-right: 1px solid var(--line); }
.pm .pm-seg button:last-child { border-right: 0; }
.pm .pm-seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.pm button:focus-visible, .pm g.pm-party:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pm .pm-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pm .pm-chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--band); color: var(--ink);
               padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.pm .pm-chip:hover { border-color: var(--ink); }
.pm .pm-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .pm .pm-grid { grid-template-columns: 1fr; } }
.pm svg.pm-chamber { width: 100%; height: auto; display: block; }
.pm g.pm-party { cursor: pointer; }
.pm g.pm-party circle { transition: fill-opacity .18s; }
.pm g.pm-party:hover circle { stroke: var(--ink); stroke-width: 1.6; }
.pm .pm-big { font-size: 64px; font-weight: 600; fill: var(--ink); }
.pm .pm-cap { font-size: 15px; fill: var(--muted); letter-spacing: .03em; }
.pm .pm-enc { display: flex; gap: 18px; justify-content: center; font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
.pm .pm-enc svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.pm .pm-meter { position: relative; margin: 26px 0 6px; }
.pm .pm-track { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--head); }
.pm .pm-track div { height: 100%; border-right: 2px solid #fff; min-width: 0; }
.pm .pm-track div:last-child { border-right: 0; }
.pm .pm-tick { position: absolute; top: -8px; bottom: -8px; left: 50.2857%; width: 2px; background: var(--ink); transform: translateX(-1px); }
.pm .pm-tick span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px;
                    font-weight: 600; padding-bottom: 1px; }
.pm .pm-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 12px; }
.pm .pm-tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--band); }
.pm .pm-tile .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pm .pm-tile .v { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pm .pm-tile .s { font-size: 12px; color: var(--muted); min-height: 1.4em; }
.pm .pm-verdict { border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 4px; padding: 10px 14px; margin: 0 0 12px; }
.pm .pm-verdict b { display: block; font-size: 17px; }
.pm .pm-verdict.good { border-left-color: var(--good); } .pm .pm-verdict.good b { color: var(--good); }
.pm .pm-verdict.warn { border-left-color: var(--warn); } .pm .pm-verdict.warn b { color: var(--warn); }
.pm .pm-verdict.bad { border-left-color: var(--bad); } .pm .pm-verdict.bad b { color: var(--bad); }
.pm .pm-probs { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.pm .pm-probs h4 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.pm .pm-prow { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
.pm .pm-prow .p { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.pm .pm-prow .t { font-size: 14px; }
.pm .pm-pbar { height: 6px; background: var(--head); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.pm .pm-pbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.pm .pm-small { font-size: 13px; color: var(--muted); }
.pm .pm-list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.pm .pm-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px;
              border-bottom: 1px solid var(--line); }
.pm .pm-row:last-child { border-bottom: 0; }
.pm .pm-row:nth-child(even) { background: var(--band); }
.pm .pm-sw { width: 10px; height: 30px; border-radius: 3px; }
.pm .pm-pn { font-weight: 600; } .pm .pm-pn span { font-weight: 400; font-variant-numeric: tabular-nums; }
.pm .pm-pm { font-size: 12px; color: var(--muted); }
.pm .pm-vote button { min-width: 44px; padding: 5px 8px; }
.pm .pm-vote button[aria-pressed="true"][data-v="a"] { background: var(--muted); }
.pm .pm-vote button[aria-pressed="true"][data-v="n"] { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
#pm-tip { position: fixed; pointer-events: none; background: #1e2430; color: #fff; font-size: 13px; padding: 5px 9px;
          border-radius: 4px; opacity: 0; transition: opacity .1s; z-index: 5; max-width: 240px; }
</style>
<div class="pm" id="pm">
  <h1 data-t="title"></h1>
  <p class="pm-sub" data-t="sub"></p>
  <p class="pm-flag" id="pm-flag"></p>
  <div class="pm-top">
    <div><span class="pm-lab" data-t="scenario"></span><span class="pm-seg" id="pm-scen"></span></div>
    <div class="pm-chips"><span class="pm-lab" data-t="presets"></span><span id="pm-presets" class="pm-chips"></span></div>
    <div class="pm-langbox" style="margin-left:auto"><span class="pm-seg" id="pm-lang"><button data-l="es">ES</button><button data-l="en">EN</button></span></div>
  </div>
  <div class="pm-grid">
    <section>
      <svg class="pm-chamber" id="pm-chamber" viewBox="0 0 1000 548" role="img"></svg>
      <div class="pm-enc">
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#5b6473"/></svg><span data-t="enc_y"></span></span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#fff" stroke="#5b6473" stroke-width="2"/></svg><span data-t="enc_a"></span></span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#5b6473" fill-opacity=".2"/></svg><span data-t="enc_n"></span></span>
      </div>
      <div class="pm-meter">
        <div class="pm-track" id="pm-track"></div>
        <div class="pm-tick"><span data-t="tick"></span></div>
      </div>
      <div class="pm-tiles">
        <div class="pm-tile"><div class="k" data-t="yes_full"></div><div class="v" id="pm-n-y"></div><div class="s" id="pm-s-y"></div></div>
        <div class="pm-tile"><div class="k" data-t="abs_full"></div><div class="v" id="pm-n-a"></div><div class="s"></div></div>
        <div class="pm-tile"><div class="k" data-t="no_full"></div><div class="v" id="pm-n-n"></div><div class="s"></div></div>
      </div>
      <div class="pm-verdict" id="pm-verdict"></div>
      <div class="pm-probs">
        <h4 data-t="probs_title"></h4>
        <div class="pm-prow"><div class="p" id="pm-p-abs"></div><div><div class="t" data-t="p_abs"></div><div class="pm-pbar"><i id="pm-b-abs"></i></div></div></div>
        <div class="pm-prow"><div class="p" id="pm-p-sim"></div><div><div class="t" data-t="p_sim"></div><div class="pm-pbar"><i id="pm-b-sim"></i></div></div></div>
        <p class="pm-small" id="pm-p-range" style="margin:8px 0 0"></p>
      </div>
    </section>
    <section>
      <p class="pm-small" data-t="hint" style="margin-top:0"></p>
      <div class="pm-list" id="pm-list"></div>
    </section>
  </div>
  <p class="pm-small" data-t="note" style="margin-top:18px;max-width:110ch"></p>
</div>
<div id="pm-tip"></div>
<script>
(function () {
const DATA = __DATA__;
const T = {
  es: {
    title: "Pactómetro del 29-N: ¿quién puede gobernar?",
    sub: "Marca el voto de cada partido en una investidura (sí, abstención o no) y comprueba si salen las cuentas. Los escaños son la previsión del modelo, no un resultado: el hemiciclo muestra los escaños esperados y las probabilidades se calculan sobre las {n} simulaciones.",
    scenario: "Escenario", presets: "Pactos de ejemplo",
    p_right: "PP + Vox", p_inv: "Bloque de la investidura de 2023", p_grand: "PP + PSOE", p_abst: "PP con abstención de Vox", p_reset: "Borrar",
    y: "Sí", a: "Abs.", n: "No", yes_full: "Sí", abs_full: "Abstención", no_full: "No",
    enc_y: "sí", enc_a: "abstención", enc_n: "no",
    tick: "176 · mayoría absoluta", cap: "síes · 176 para la mayoría absoluta", cap0: "escaños · 176 para la mayoría absoluta",
    v0_t: "Elige un pacto", v0_s: "Marca qué partidos votan sí y cuáles se abstienen; el resto vota no.",
    v1_t: "✔ Investidura en primera votación", v1_s: "Los síes ({y}) alcanzan la mayoría absoluta de 176 escaños.",
    v2_t: "◐ Investidura en segunda votación", v2_s: "No hay mayoría absoluta (faltan {m} síes), pero en la segunda votación basta con más síes ({y}) que noes ({n}).",
    v3_t: "✖ Investidura fallida", v3_s: "Faltan {m} síes para la mayoría absoluta y, en la segunda votación, los noes ({n}) no quedan por debajo de los síes ({y}).",
    probs_title: "Este mismo pacto en las {n} simulaciones del modelo",
    p_abs: "los síes llegan a 176 (mayoría absoluta)", p_sim: "hay más síes que noes (basta en segunda votación)",
    p_range: "Síes en las simulaciones: mediana {m}, intervalo del 90 %: {a}-{b}.", p_range0: "Todavía no hay ningún partido marcado.",
    row: "intervalo del 90 %: {a}-{b} escaños",
    hint: "Pulsa un partido en el hemiciclo para cambiar su voto, o usa los botones de esta lista.",
    note: "Artículo 99 de la Constitución: la investidura exige mayoría absoluta (176 de 350) en la primera votación o, 48 horas después, más síes que noes. Los escaños esperados son la media de las simulaciones, redondeada para sumar 350; cada simulación reparte los escaños de otra manera, por eso un pacto que en el dibujo se queda cerca de 176 tiene una probabilidad intermedia. «Otros» son candidaturas locales (Soria ¡Ya!, Teruel Existe, UPL). La línea discontinua marca la mitad del hemiciclo. Datos hasta el {cutoff}.",
    tip: "{name}: {s} escaños esperados (90 %: {a}-{b}) · vota {v}", tip0: "{name}: {s} escaños esperados (90 %: {a}-{b})", vy: "sí", va: "abstención", vn: "no",
    aria: "Hemiciclo de 350 escaños: {y} sí, {a} abstención, {n} no. Mayoría absoluta: 176."
  },
  en: {
    title: "Coalition builder for 29 November: who can govern?",
    sub: "Set each party's vote in an investiture (yes, abstain or no) and see whether the numbers add up. Seats are the model's forecast, not a result: the chamber shows expected seats and the probabilities are counted over the {n} simulations.",
    scenario: "Scenario", presets: "Example pacts",
    p_right: "PP + Vox", p_inv: "2023 investiture bloc", p_grand: "PP + PSOE", p_abst: "PP, Vox abstains", p_reset: "Clear",
    y: "Yes", a: "Abs.", n: "No", yes_full: "Yes", abs_full: "Abstain", no_full: "No",
    enc_y: "yes", enc_a: "abstain", enc_n: "no",
    tick: "176 · absolute majority", cap: "yes votes · 176 for an absolute majority", cap0: "seats · 176 for an absolute majority",
    v0_t: "Pick a pact", v0_s: "Mark which parties vote yes and which abstain; the rest vote no.",
    v1_t: "✔ Elected on the first vote", v1_s: "The yes votes ({y}) reach the absolute majority of 176 seats.",
    v2_t: "◐ Elected on the second vote", v2_s: "No absolute majority ({m} short), but on the second vote more yes ({y}) than no ({n}) is enough.",
    v3_t: "✖ Investiture fails", v3_s: "{m} yes votes short of the absolute majority and, on the second vote, the no votes ({n}) are not below the yes votes ({y}).",
    probs_title: "The same pact in the model's {n} simulations",
    p_abs: "the yes votes reach 176 (absolute majority)", p_sim: "more yes than no (enough on the second vote)",
    p_range: "Yes votes across simulations: median {m}, 90 % interval {a}-{b}.", p_range0: "No party is marked yet.",
    row: "90 % range: {a}-{b} seats",
    hint: "Click a party in the chamber to change its vote, or use the buttons in this list.",
    note: "Article 99 of the Spanish Constitution: an investiture needs an absolute majority (176 of 350) on the first vote or, 48 hours later, more yes than no votes. Expected seats are the mean of the simulations, rounded to add up to 350; each simulation splits the seats differently, which is why a pact that sits near 176 in the picture has an in-between probability. \"Others\" are local lists (Soria ¡Ya!, Teruel Existe, UPL). The dashed line marks the middle of the chamber. Data to {cutoff}.",
    tip: "{name}: {s} expected seats (90 %: {a}-{b}) · votes {v}", tip0: "{name}: {s} expected seats (90 %: {a}-{b})", vy: "yes", va: "abstain", vn: "no",
    aria: "Chamber of 350 seats: {y} yes, {a} abstain, {n} no. Absolute majority: 176."
  }
};
const PRESETS = {
  p_right: {y: ["PP", "VOX", "UPN", "SALF"]},
  p_inv: {y: ["PSOE", "SUMAR", "PODEMOS", "ERC", "BILDU", "BNG", "CC", "AA", "PNV", "JUNTS"]},
  p_grand: {y: ["PP", "PSOE"]},
  p_abst: {y: ["PP", "UPN"], a: ["VOX"]},
  p_reset: {}
};
const NS = "http://www.w3.org/2000/svg";
const root = document.getElementById("pm"), $ = id => document.getElementById("pm-" + id);
const state = {lang: DATA.default_lang, scen: Object.keys(DATA.scenarios)[0], vote: {}};
if (DATA.embedded) root.classList.add("pm-embedded");
const draws = {};
for (const [k, s] of Object.entries(DATA.scenarios)) {
  const bin = atob(s.draws), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  draws[k] = a;
}
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, state.lang === "es" ? "." : ",");
const pct = p => p > 0.995 ? "> 99 %" : p < 0.005 ? "< 1 %" : Math.round(100 * p) + " %";
const name = id => DATA.names[state.lang][id] || id;
const parties = () => DATA.scenarios[state.scen].parties;
const voteOf = id => state.vote[id] || "n";
// nothing marked yet: the chamber is drawn in full colour, as the plain forecast
const blank = () => !parties().some(p => voteOf(p.id) !== "n");

function setVote(id, v) { state.vote[id] = v; render(); }
function cycle(id) { setVote(id, {n: "y", y: "a", a: "n"}[voteOf(id)]); }
function preset(key) {
  const p = PRESETS[key]; state.vote = {};
  (p.y || []).forEach(id => state.vote[id] = "y"); (p.a || []).forEach(id => state.vote[id] = "a");
  render();
}

function simulate() {
  const s = DATA.scenarios[state.scen], d = draws[state.scen], k = s.parties.length, n = d.length / k;
  const w = s.parties.map(p => ({y: 1, a: 0, n: -1}[voteOf(p.id)]));
  const yes = new Uint16Array(n); let abs = 0, simple = 0;
  for (let i = 0; i < n; i++) {
    let y = 0, no = 0;
    for (let j = 0; j < k; j++) { const v = d[i * k + j]; if (w[j] === 1) y += v; else if (w[j] === -1) no += v; }
    yes[i] = y; if (y >= 176) abs++; if (y > no) simple++;
  }
  const sorted = Array.from(yes).sort((a, b) => a - b), q = f => sorted[Math.min(n - 1, Math.floor(f * n))];
  return {abs: abs / n, simple: simple / n, q05: q(0.05), q50: q(0.5), q95: q(0.95)};
}

function buildChamber() {
  const svg = $("chamber"); svg.textContent = "";
  let i = 0;
  for (const p of parties()) {
    if (!p.seats) continue;
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "pm-party"); g.dataset.id = p.id; g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
    for (let s = 0; s < p.seats; s++, i++) {
      const [x, y] = DATA.layout[i], c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", (500 + 462 * x).toFixed(1)); c.setAttribute("cy", (508 - 462 * y).toFixed(1)); c.setAttribute("r", 9.6);
      g.appendChild(c);
    }
    g.addEventListener("click", () => cycle(p.id));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cycle(p.id); } });
    g.addEventListener("mousemove", e => showTip(e, p)); g.addEventListener("mouseleave", hideTip);
    svg.appendChild(g);
  }
  const line = document.createElementNS(NS, "line");
  line.setAttribute("x1", 500); line.setAttribute("x2", 500); line.setAttribute("y1", 508 - 462 * 1.045); line.setAttribute("y2", 508 - 462 * 0.375);
  line.setAttribute("stroke", "#1e2430"); line.setAttribute("stroke-width", 1.2); line.setAttribute("stroke-dasharray", "5 4"); line.setAttribute("pointer-events", "none");
  svg.appendChild(line);
  const mk = (cls, y, id) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", 500); t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("class", cls); t.id = "pm-" + id; svg.appendChild(t); return t; };
  mk("pm-cap", 17, "lab176").textContent = "176"; mk("pm-big", 478, "big"); mk("pm-cap", 512, "cap");
}

function showTip(e, p) {
  const t = T[state.lang], tip = document.getElementById("pm-tip");
  tip.textContent = fmt(blank() ? t.tip0 : t.tip, {name: name(p.id), s: p.seats, a: p.q05, b: p.q95, v: t["v" + voteOf(p.id)]});
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 250) + "px"; tip.style.top = (e.clientY + 14) + "px"; tip.style.opacity = 1;
}
function hideTip() { document.getElementById("pm-tip").style.opacity = 0; }

function buildList() {
  const t = T[state.lang], box = $("list"); box.textContent = "";
  const rows = [...parties()].sort((a, b) => b.seats - a.seats);
  for (const p of rows) {
    const r = document.createElement("div"); r.className = "pm-row";
    r.innerHTML = `<div class="pm-sw" style="background:${DATA.colors[p.id] || "#999"}"></div>
      <div><div class="pm-pn">${name(p.id)} <span>${p.seats}</span></div><div class="pm-pm">${fmt(t.row, {a: p.q05, b: p.q95})}</div></div>
      <div class="pm-seg pm-vote" role="group" aria-label="${name(p.id)}">${["y", "a", "n"].map(v =>
        `<button data-v="${v}" aria-pressed="false" title="${t[{y: "yes_full", a: "abs_full", n: "no_full"}[v]]}">${t[v]}</button>`).join("")}</div>`;
    r.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setVote(p.id, b.dataset.v)));
    r.dataset.id = p.id; box.appendChild(r);
  }
}

function buildStatic() {
  const t = T[state.lang];
  if (!DATA.embedded) { document.documentElement.lang = state.lang; document.title = t.title; }
  root.querySelectorAll("[data-t]").forEach(el => {
    el.textContent = fmt(t[el.dataset.t], {n: nf(DATA.n_sims), cutoff: DATA.cutoff[state.lang]}); });
  $("flag").textContent = DATA.provisional[state.lang] || "";
  const sc = $("scen"); sc.textContent = "";
  for (const k of Object.keys(DATA.scenarios)) {
    const b = document.createElement("button"); b.textContent = DATA.scenarios[k].label[state.lang];
    b.setAttribute("aria-pressed", k === state.scen); b.addEventListener("click", () => { state.scen = k; rebuild(); }); sc.appendChild(b);
  }
  const pr = $("presets"); pr.textContent = "";
  for (const k of Object.keys(PRESETS)) {
    const b = document.createElement("button"); b.className = "pm-chip"; b.textContent = t[k]; b.addEventListener("click", () => preset(k)); pr.appendChild(b);
  }
  root.querySelectorAll("#pm-lang button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.l === state.lang);
    b.onclick = () => { state.lang = b.dataset.l; rebuild(); }; });
}

function render() {
  const t = T[state.lang], tot = {y: 0, a: 0, n: 0}, track = $("track"), none = blank(); track.textContent = "";
  const groups = {y: [], a: [], n: []};
  for (const p of parties()) { const v = voteOf(p.id); tot[v] += p.seats; if (p.seats) groups[v].push(p); }
  for (const g of root.querySelectorAll("g.pm-party")) {
    const v = voteOf(g.dataset.id), c = DATA.colors[g.dataset.id] || "#999";
    g.setAttribute("aria-label", none ? name(g.dataset.id) : `${name(g.dataset.id)}: ${t["v" + v]}`);
    for (const el of g.children) {
      el.setAttribute("fill", v === "a" ? "#fff" : c); el.setAttribute("fill-opacity", v === "n" && !none ? 0.2 : 1);
      el.setAttribute("stroke", c); el.setAttribute("stroke-width", v === "a" ? 2.6 : 0); el.setAttribute("r", v === "a" ? 8.3 : 9.6);
    }
  }
  for (const v of ["y", "a", "n"]) for (const p of groups[v]) {
    const d = document.createElement("div"), c = DATA.colors[p.id] || "#999";
    d.style.width = (100 * p.seats / 350) + "%";
    d.style.background = v === "y" ? c : v === "a" ? `repeating-linear-gradient(135deg, ${c}66 0 4px, #fff 4px 8px)` : c + (none ? "" : "2e");
    d.title = none ? `${name(p.id)} · ${p.seats}` : `${name(p.id)} · ${p.seats} · ${t[{y: "yes_full", a: "abs_full", n: "no_full"}[v]]}`;
    track.appendChild(d);
  }
  $("n-y").textContent = none ? "–" : tot.y; $("n-a").textContent = none ? "–" : tot.a; $("n-n").textContent = none ? "–" : tot.n;
  $("s-y").textContent = groups.y.map(p => name(p.id)).join(" + ");
  $("big").textContent = none ? 350 : tot.y; $("cap").textContent = none ? t.cap0 : t.cap;
  $("chamber").setAttribute("aria-label", fmt(t.aria, tot));
  const v = $("verdict"), o = {y: tot.y, n: tot.n, m: Math.max(0, 176 - tot.y)};
  const kind = none ? ["", "v0"] : tot.y >= 176 ? ["good", "v1"] : tot.y > tot.n ? ["warn", "v2"] : ["bad", "v3"];
  v.className = "pm-verdict " + kind[0]; v.innerHTML = `<b>${t[kind[1] + "_t"]}</b>${fmt(t[kind[1] + "_s"], o)}`;
  const s = simulate();
  $("p-abs").textContent = none ? "–" : pct(s.abs); $("b-abs").style.width = (none ? 0 : 100 * s.abs) + "%";
  $("p-sim").textContent = none ? "–" : pct(s.simple); $("b-sim").style.width = (none ? 0 : 100 * s.simple) + "%";
  $("p-range").textContent = none ? t.p_range0 : fmt(t.p_range, {m: s.q50, a: s.q05, b: s.q95});
  for (const r of root.querySelectorAll(".pm-row")) r.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", !none && b.dataset.v === voteOf(r.dataset.id)));
}

function rebuild() { buildStatic(); buildChamber(); buildList(); render(); }
rebuild();
})();
</script>
<!--PM:END-->
