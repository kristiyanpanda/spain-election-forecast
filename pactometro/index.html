<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pactómetro 29-N</title>
<style>
body { font-family: Calibri, Carlito, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.45;
       color: #1e2430; background: #fff; max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
</style>
</head>
<body>
<!--PM:START (everything down to PM:END is the widget; electoral.report embeds it in the forecast page)-->
<style>
.pm { --ink:#1e2430; --muted:#5b6473; --line:#c9ced6; --head:#eef1f5; --accent:#1f6fb2; --band:#f7f8fa;
      --good:#1b7f4b; --warn:#a86a00; --bad:#b00020; color: var(--ink); line-height: 1.45; }
.pm, .pm * { box-sizing: border-box; }
.pm h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
.pm .pm-sub { color: var(--muted); margin: 0 0 14px; max-width: 86ch; }
.pm .pm-flag { color: var(--bad); font-weight: 600; font-size: 13px; margin: 0 0 12px; }
.pm.pm-embedded h1, .pm.pm-embedded .pm-flag, .pm.pm-embedded .pm-langbox { display: none; }
.pm .pm-top { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 12px; }
.pm .pm-lab { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.pm .pm-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.pm .pm-seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 6px 12px;
                     cursor: pointer; border-right: 1px solid var(--line); }
.pm .pm-seg button:last-child { border-right: 0; }
.pm .pm-seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.pm button:focus-visible, .pm g.pm-party:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pm .pm-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pm .pm-chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--band); color: var(--ink);
               padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.pm .pm-chip:hover { border-color: var(--ink); }
.pm .pm-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
@media (max-width: 880px) { .pm .pm-grid { grid-template-columns: 1fr; } }
.pm svg.pm-chamber { width: 100%; height: auto; display: block; }
.pm g.pm-party { cursor: pointer; }
.pm g.pm-party circle { transition: fill-opacity .18s; }
.pm g.pm-party:hover circle { stroke: var(--ink); stroke-width: 1.6; }
.pm .pm-big { font-size: 64px; font-weight: 600; fill: var(--ink); }
.pm .pm-cap { font-size: 15px; fill: var(--muted); letter-spacing: .03em; }
.pm .pm-enc { display: flex; gap: 18px; justify-content: center; font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
.pm .pm-enc svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.pm .pm-meter { position: relative; margin: 26px 0 6px; }
.pm .pm-track { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--head); }
.pm .pm-track div { height: 100%; border-right: 2px solid #fff; min-width: 0; }
.pm .pm-track div:last-child { border-right: 0; }
.pm .pm-tick { position: absolute; top: -8px; bottom: -8px; left: 50.2857%; width: 2px; background: var(--ink); transform: translateX(-1px); }
.pm .pm-tick span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px;
                    font-weight: 600; padding-bottom: 1px; }
.pm .pm-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 12px; }
.pm .pm-tile { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--band); }
.pm .pm-tile .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pm .pm-tile .v { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pm .pm-tile .s { font-size: 12px; color: var(--muted); min-height: 1.4em; }
.pm .pm-verdict { border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 4px; padding: 10px 14px; margin: 0 0 12px; }
.pm .pm-verdict b { display: block; font-size: 17px; }
.pm .pm-verdict.good { border-left-color: var(--good); } .pm .pm-verdict.good b { color: var(--good); }
.pm .pm-verdict.warn { border-left-color: var(--warn); } .pm .pm-verdict.warn b { color: var(--warn); }
.pm .pm-verdict.bad { border-left-color: var(--bad); } .pm .pm-verdict.bad b { color: var(--bad); }
.pm .pm-probs { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.pm .pm-probs h4 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.pm .pm-prow { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
.pm .pm-prow .p { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.pm .pm-prow .t { font-size: 14px; }
.pm .pm-pbar { height: 6px; background: var(--head); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.pm .pm-pbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.pm .pm-small { font-size: 13px; color: var(--muted); }
.pm .pm-list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.pm .pm-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px;
              border-bottom: 1px solid var(--line); }
.pm .pm-row:last-child { border-bottom: 0; }
.pm .pm-row:nth-child(even) { background: var(--band); }
.pm .pm-sw { width: 10px; height: 30px; border-radius: 3px; }
.pm .pm-pn { font-weight: 600; } .pm .pm-pn span { font-weight: 400; font-variant-numeric: tabular-nums; }
.pm .pm-pm { font-size: 12px; color: var(--muted); }
.pm .pm-vote button { min-width: 44px; padding: 5px 8px; }
.pm .pm-vote button[aria-pressed="true"][data-v="a"] { background: var(--muted); }
.pm .pm-vote button[aria-pressed="true"][data-v="n"] { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
#pm-tip { position: fixed; pointer-events: none; background: #1e2430; color: #fff; font-size: 13px; padding: 5px 9px;
          border-radius: 4px; opacity: 0; transition: opacity .1s; z-index: 5; max-width: 240px; }
</style>
<div class="pm" id="pm">
  <h1 data-t="title"></h1>
  <p class="pm-sub" data-t="sub"></p>
  <p class="pm-flag" id="pm-flag"></p>
  <div class="pm-top">
    <div><span class="pm-lab" data-t="scenario"></span><span class="pm-seg" id="pm-scen"></span></div>
    <div class="pm-chips"><span class="pm-lab" data-t="presets"></span><span id="pm-presets" class="pm-chips"></span></div>
    <div class="pm-langbox" style="margin-left:auto"><span class="pm-seg" id="pm-lang"><button data-l="es">ES</button><button data-l="en">EN</button></span></div>
  </div>
  <div class="pm-grid">
    <section>
      <svg class="pm-chamber" id="pm-chamber" viewBox="0 0 1000 548" role="img"></svg>
      <div class="pm-enc">
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#5b6473"/></svg><span data-t="enc_y"></span></span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#fff" stroke="#5b6473" stroke-width="2"/></svg><span data-t="enc_a"></span></span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#5b6473" fill-opacity=".2"/></svg><span data-t="enc_n"></span></span>
      </div>
      <div class="pm-meter">
        <div class="pm-track" id="pm-track"></div>
        <div class="pm-tick"><span data-t="tick"></span></div>
      </div>
      <div class="pm-tiles">
        <div class="pm-tile"><div class="k" data-t="yes_full"></div><div class="v" id="pm-n-y"></div><div class="s" id="pm-s-y"></div></div>
        <div class="pm-tile"><div class="k" data-t="abs_full"></div><div class="v" id="pm-n-a"></div><div class="s"></div></div>
        <div class="pm-tile"><div class="k" data-t="no_full"></div><div class="v" id="pm-n-n"></div><div class="s"></div></div>
      </div>
      <div class="pm-verdict" id="pm-verdict"></div>
      <div class="pm-probs">
        <h4 data-t="probs_title"></h4>
        <div class="pm-prow"><div class="p" id="pm-p-abs"></div><div><div class="t" data-t="p_abs"></div><div class="pm-pbar"><i id="pm-b-abs"></i></div></div></div>
        <div class="pm-prow"><div class="p" id="pm-p-sim"></div><div><div class="t" data-t="p_sim"></div><div class="pm-pbar"><i id="pm-b-sim"></i></div></div></div>
        <p class="pm-small" id="pm-p-range" style="margin:8px 0 0"></p>
      </div>
    </section>
    <section>
      <p class="pm-small" data-t="hint" style="margin-top:0"></p>
      <div class="pm-list" id="pm-list"></div>
    </section>
  </div>
  <p class="pm-small" data-t="note" style="margin-top:18px;max-width:110ch"></p>
</div>
<div id="pm-tip"></div>

function setVote(id, v) { state.vote[id] = v; render(); }
function cycle(id) { setVote(id, {n: "y", y: "a", a: "n"}[voteOf(id)]); }

function simulate() {
  const s = DATA.scenarios[state.scen], d = draws[state.scen], k = s.parties.length, n = d.length / k;
  const w = s.parties.map(p => ({y: 1, a: 0, n: -1}[voteOf(p.id)]));
  const yes = new Uint16Array(n); let abs = 0, simple = 0;
  for (let i = 0; i < n; i++) {

  }
  root.querySelectorAll("#pm-lang button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.l === state.lang);
    b.onclick = () => { state.lang = b.dataset.l; rebuild(); }; });
}

function render() {
  const t = T[state.lang], tot = {y: 0, a: 0, n: 0}, track = $("track"), none = blank(); track.textContent = "";
  const groups = {y: [], a: [], n: []};
  for (const p of parties()) { const v = voteOf(p.id); tot[v] += p.seats; if (p.seats) groups[v].push(p); }
  for (const g of root.querySelectorAll("g.pm-party")) {
    const v = voteOf(g.dataset.id), c = DATA.colors[g.dataset.id] || "#999";
    g.setAttribute("aria-label", none ? name(g.dataset.id) : `${name(g.dataset.id)}: ${t["v" + v]}`);
    for (const el of g.children) {
      el.setAttribute("fill", v === "a" ? "#fff" : c); el.setAttribute("fill-opacity", v === "n" && !none ? 0.2 : 1);
      el.setAttribute("stroke", c); el.setAttribute("stroke-width", v === "a" ? 2.6 : 0); el.setAttribute("r", v === "a" ? 8.3 : 9.6);
    }
  }
  for (const v of ["y", "a", "n"]) for (const p of groups[v]) {
    const d = document.createElement("div"), c = DATA.colors[p.id] || "#999";
    d.style.width = (100 * p.seats / 350) + "%";
    d.style.background = v === "y" ? c : v === "a" ? `repeating-linear-gradient(135deg, ${c}66 0 4px, #fff 4px 8px)` : c + (none ? "" : "2e");
    d.title = none ? `${name(p.id)} · ${p.seats}` : `${name(p.id)} · ${p.seats} · ${t[{y: "yes_full", a: "abs_full", n: "no_full"}[v]]}`;
    track.appendChild(d);
  }
  $("n-y").textContent = none ? "–" : tot.y; $("n-a").textContent = none ? "–" : tot.a; $("n-n").textContent = none ? "–" : tot.n;
  $("s-y").textContent = groups.y.map(p => name(p.id)).join(" + ");
  $("big").textContent = none ? 350 : tot.y; $("cap").textContent = none ? t.cap0 : t.cap;
  $("chamber").setAttribute("aria-label", fmt(t.aria, tot));
  const v = $("verdict"), o = {y: tot.y, n: tot.n, m: Math.max(0, 176 - tot.y)};
  const kind = none ? ["", "v0"] : tot.y >= 176 ? ["good", "v1"] : tot.y > tot.n ? ["warn", "v2"] : ["bad", "v3"];
  v.className = "pm-verdict " + kind[0]; v.innerHTML = `<b>${t[kind[1] + "_t"]}</b>${fmt(t[kind[1] + "_s"], o)}`;
  const s = simulate();
  $("p-abs").textContent = none ? "–" : pct(s.abs); $("b-abs").style.width = (none ? 0 : 100 * s.abs) + "%";
  $("p-sim").textContent = none ? "–" : pct(s.simple); $("b-sim").style.width = (none ? 0 : 100 * s.simple) + "%";
  $("p-range").textContent = none ? t.p_range0 : fmt(t.p_range, {m: s.q50, a: s.q05, b: s.q95});
  for (const r of root.querySelectorAll(".pm-row")) r.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", !none && b.dataset.v === voteOf(r.dataset.id)));
}

function rebuild() { buildStatic(); buildChamber(); buildList(); render(); }
rebuild();
})();
</script>
<!--PM:END-->
