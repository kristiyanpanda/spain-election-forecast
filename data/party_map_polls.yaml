# Maps Wikipedia column labels -> canonical party id. Keys are matched after normalisation
# (lower-case, accents stripped, dashes unified, spaces/apostrophes removed), so "ERC–Sobiranistes"
# and "erc-sobiranistes" are the same key. Anything not listed is an error at build time.
#
# Lineage choices are documented in docs/party_mapping.md. Summary of the non-obvious ones:
#   JUNTS   = DiL (2015) -> PDeCAT (2016-18) -> JxCat (2019) -> Junts (2023-): the post-Convergència line
#   UP      = Unidos/Unidas Podemos (2016-2023, Podemos + IU + confluences)
#   SUMAR   = Sumar platform (2023-); Podemos inside Sumar until Dec 2023, then separate
#   CC      = Coalición Canaria in all its coalition labels (CC, CCa, CC-NCa, CC-PNC)
#   UPN     = UPN alone or as NA+ (2019 coalition with PP and Cs in Navarre)
labels:
  PP: PP
  PSOE: PSOE
  Vox: VOX
  Sumar: SUMAR
  Podemos: PODEMOS
  Unidas Podemos: UP
  Unidos Podemos: UP
  IU–UPeC: IU
  Cs: CS
  CS: CS
  C's: CS
  ERC: ERC
  ERC–CatSí: ERC
  ERC–Sobiranistes: ERC
  Junts: JUNTS
  JxCat: JUNTS
  PDeCAT: JUNTS
  DiL: JUNTS
  EH Bildu: BILDU
  PNV: PNV
  BNG: BNG
  CC: CC
  CCa: CC
  CC–NCa: CC
  UPN: UPN
  NA+: UPN
  Adelante Andalucía (2021): AA
  SALF: SALF
  Aliança.cat: ALIANCA
  CUP: CUP
  EV: EV
  TE: TE
  Más País: MASPAIS
  Compromís: COMPROMIS
  PRC: PRC
  PACMA: PACMA

# Display names and bloc for every canonical id used in polls or results.
# Blocs (used for the bloc matrix, volatility split and the 176-seat majority questions):
#   left        state-wide left (PSOE, PCE/IU, Podemos lineage, Sumar, Más País, PSP)
#   right       state-wide centre-right and right (UCD, AP/PP, CDS, Cs, UPyD, Vox, SALF, UN)
#   periph_left  sub-state left / nationalist left (ERC, HB/Bildu, BNG, CUP, Compromís, EA, EE, PA, CHA, Nabai, AA)
#   periph_right sub-state centre/right (CiU/Junts, PNV, CC, PAR, UV, FAC, UPN/NA+, Aliança, CG)
#   other       animal-rights, empty-Spain and unclassified lists (PACMA, TE, EV, Ruiz-Mateos...)
# Lineage used ONLY for Pedersen volatility (Bartolini-Mair merger rule: a merged list is
# compared with the sum of its predecessors). ENP and the bloc matrix use lists as they ran.
volatility_lineage:
  IU: UP_LINEAGE
  PODEMOS: UP_LINEAGE
  UP: UP_LINEAGE
  SUMAR: UP_LINEAGE
  MASPAIS: UP_LINEAGE

parties:
  PP:        {name: "Partido Popular (AP/CP before 1989)", bloc: right}
  UCD:       {name: "Unión de Centro Democrático", bloc: right}
  CDS:       {name: "Centro Democrático y Social", bloc: right}
