# Single source of truth for dates, seeds and file locations.
# Every script reads this file; every output is stamped with `cutoff_date`.

author:                          # shown on docs/index.html; edit freely
  name: "Kristiyan Pandas"
  github: "https://github.com/kristiyanpanda"

cutoff_date: "2026-09-18"        # polls published on or before this date are used
last_election: "2023-07-23"
legal_deadline: "2027-08-15"     # term expires 2027-07-23; election on day 54 after convocation
seed: 20260918

model:
  # parties tracked by the aggregator in the current cycle; everything else is "other"
  parties: [PP, PSOE, VOX, SUMAR, PODEMOS, SALF, ERC, JUNTS, BILDU, PNV, BNG, CC]
  # one-off level shifts allowed in the latent series (party: date)
  breaks:
    SUMAR: "2023-12-08"      # Podemos leaves the Sumar group; first poll listing them apart
  sampling: {draws: 1000, tune: 1000, chains: 4, target_accept: 0.9}

backtest:
  lead_days: 30            # observation cut-off = election day - lead_days
  n_sims: 10000
  sampling: {draws: 600, tune: 600, chains: 4, target_accept: 0.9}
  cycles:
    e2016:
      election: "201606"
      previous: "201512"
      parties: [PP, PSOE, UP, CS, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {UP: [PODEMOS, IU]}                     # 2015: Podemos (+confluences) and IU ran apart
      composites: {UP: {sum: [UP], fallback: [PODEMOS, IU]}}
      absorb: {UP: [PODEMOS, IU]}
      proxies: {}
      breaks: {}
    e2019apr:
      election: "201904"
      previous: "201606"
      parties: [PP, PSOE, UP, CS, VOX, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {}
      composites: {}
      absorb: {}
      proxies: {VOX: PP}                                  # 0.2 % in 2016: borrow PP's geography
      breaks: {}
    e2019nov:
      election: "201911"
      previous: "201904"
      parties: [PP, PSOE, UP, CS, VOX, MASPAIS, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {}
      composites: {}
      absorb: {}
      proxies: {MASPAIS: UP}
      breaks: {}
    e2023:
      election: "202307"
      previous: "201911"
      parties: [PP, PSOE, VOX, SUMAR, CS, ERC, JUNTS, PNV, BILDU, BNG, CC]
      anchor_sum: {SUMAR: [UP, MASPAIS, COMPROMIS]}      # Sumar absorbed UP, Más País and Compromís
      composites: {SUMAR: {sum: [SUMAR, PODEMOS], fallback: [UP, MASPAIS], fallback_min: 1}}
      absorb: {SUMAR: [UP, MASPAIS, COMPROMIS]}
      proxies: {}
      breaks: {}

paths:
  raw_mir: data/raw/mir
  raw_polls: data/raw/polls
  processed: data/processed
  outputs: outputs
  figures: reports/figures

mir:
  base_url: "https://infoelectoral.interior.gob.es/estaticos/docxl/apliextr"
  # Congreso de los Diputados (tipo 02), all general elections 1977-2023
  elections: ["197706", "197903", "198210", "198606", "198910", "199306", "199603",
              "200003", "200403", "200803", "201111", "201512", "201606", "201904",
              "201911", "202307"]

wikipedia:
  # English Wikipedia, CC BY-SA 4.0. Fetched as wikitext via action=raw.
  pages:
    next: "Opinion_polling_for_the_next_Spanish_general_election"
    e2023: "Opinion_polling_for_the_2023_Spanish_general_election"
    e2023_2022: "Nationwide_opinion_polling_for_the_2023_Spanish_general_election_(2022)"
    e2023_2019_2021: "Nationwide_opinion_polling_for_the_2023_Spanish_general_election_(2019–2021)"
    e2019nov: "Opinion_polling_for_the_November_2019_Spanish_general_election"
    e2019apr: "Opinion_polling_for_the_April_2019_Spanish_general_election"
    e2016: "Opinion_polling_for_the_2016_Spanish_general_election"
