# Single source of truth for dates, seeds and file locations.
# Every script reads this file; every output is stamped with `cutoff_date`.

author:                          # shown on docs/index.html; edit freely
  name: "Kristiyan Pandas"
  github: "https://github.com/kristiyanpanda"

cutoff_date: "2026-10-17"        # polls published on or before this date are used
last_election: "2023-07-23"
legal_deadline: "2027-08-15"     # term expires 2027-07-23; election on day 54 after convocation
election_date: "2026-11-29"      # snap election (RD 806/2026, BOE 6 Oct 2026): the forecast horizon
seed: 20260918

model:
  # parties tracked by the aggregator in the current cycle; everything else is "other"
  # SUMAR is the Sumar -> Frente Amplio lineage (FA from 17 Oct 2026; see composites)
  parties: [PP, PSOE, VOX, SUMAR, PODEMOS, SALF, ERC, JUNTS, BILDU, PNV, BNG, CC, AA]
  # polls that list Frente Amplio feed the SUMAR series; earlier polls list Sumar itself
  composites: {SUMAR: {sum: [FA], fallback: [SUMAR], fallback_min: 1}}
  # one-off level shifts allowed in the latent series (party: date)
  breaks:
    SUMAR: "2023-12-08"      # Podemos leaves the Sumar group; first poll listing them apart
  sampling: {draws: 1000, tune: 1000, chains: 4, target_accept: 0.9}

# Party supply on 29 Nov 2026 (press reports as of 17 Oct; the JEC had not yet published the
# validated coalitions). Geography borrowed by parties without a 2023 provincial footprint:
# a party id, null (uniform) or a list of provinces (uniform over them).
seats:
  proxies:
    PODEMOS: SUMAR                                   # Podemos ran inside Sumar in 2023
    SALF: null
    AA: ["04", "11", "14", "18", "21", "23", "29", "41"]   # Adelante Andalucía: Andalusia only
  # Joint lists applied province by province after the swing (electoral.seats.apply_merges).
  scenarios:
    split:      # BASE CASE: Frente Amplio and Podemos run apart except where noted
      label: "Split left (base case)"
      merges:
        - {provinces: ["31"], party: UPN, into: {PP: 1.0}}               # PP+UPN coalition in Navarra
        - {provinces: ["35", "38"], party: PODEMOS, into: {SUMAR: 1.0}}  # Unidad del Pueblo Canario (FA+Podemos+NC)
        - {provinces: ["03", "12", "46"], party: PODEMOS, into: {SUMAR: 1.0}}  # Compromís-Front Valencià
        # Catalonia: no Podemos list; its candidates sit on ERC's lists. WEAKEST ASSUMPTION:
        # half of the Podemos vote polled nationally in Catalonia follows them to ERC, half
        # goes to the Comuns / Frente Amplio list (no poll measures this split).
        - {provinces: ["08", "17", "25", "43"], party: PODEMOS, into: {ERC: 0.5, SUMAR: 0.5}}
    merged:     # SENSITIVITY: one Frente Amplio + Podemos list everywhere
      label: "Merged left (sensitivity)"
      merges:
        - {provinces: ["31"], party: UPN, into: {PP: 1.0}}
        # 2016 precedent: Unidos Podemos kept about 0.83 of Podemos + IU's separate support;
        # the efficiency multiplies the joint list's total (FA + Podemos)
        - {provinces: all, party: PODEMOS, into: {SUMAR: 1.0}, efficiency: {mean: 0.83, sd: 0.05}}

backtest:
  lead_days: 30            # observation cut-off = election day - lead_days
  n_sims: 10000
  sampling: {draws: 600, tune: 600, chains: 4, target_accept: 0.9}
  cycles:
    e2016:
      election: "201606"
      previous: "201512"
      parties: [PP, PSOE, UP, CS, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {UP: [PODEMOS, IU]}                     # 2015: Podemos (+confluences) and IU ran apart
      composites: {UP: {sum: [UP], fallback: [PODEMOS, IU]}}
      absorb: {UP: [PODEMOS, IU]}
      proxies: {}
      breaks: {}
    e2019apr:
      election: "201904"
      previous: "201606"
      parties: [PP, PSOE, UP, CS, VOX, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {}
      composites: {}
      absorb: {}
      proxies: {VOX: PP}                                  # 0.2 % in 2016: borrow PP's geography
      breaks: {}
    e2019nov:
      election: "201911"
      previous: "201904"
      parties: [PP, PSOE, UP, CS, VOX, MASPAIS, ERC, JUNTS, PNV, BILDU, CC]
      anchor_sum: {}
      composites: {}
      absorb: {}
      proxies: {MASPAIS: UP}
      breaks: {}
    e2023:
      election: "202307"
      previous: "201911"
      parties: [PP, PSOE, VOX, SUMAR, CS, ERC, JUNTS, PNV, BILDU, BNG, CC]
      anchor_sum: {SUMAR: [UP, MASPAIS, COMPROMIS]}      # Sumar absorbed UP, Más País and Compromís
      composites: {SUMAR: {sum: [SUMAR, PODEMOS], fallback: [UP, MASPAIS], fallback_min: 1}}
      absorb: {SUMAR: [UP, MASPAIS, COMPROMIS]}
      proxies: {}
      breaks: {}

paths:
  raw_mir: data/raw/mir
  raw_polls: data/raw/polls
  raw_cis: data/raw/cis
  processed: data/processed
  outputs: outputs
  figures: reports/figures

mir:
  base_url: "https://infoelectoral.interior.gob.es/estaticos/docxl/apliextr"
  # Congreso de los Diputados (tipo 02), all general elections 1977-2023
  elections: ["197706", "197903", "198210", "198606", "198910", "199306", "199603",
              "200003", "200403", "200803", "201111", "201512", "201606", "201904",
              "201911", "202307"]

wikipedia:
  # English Wikipedia, CC BY-SA 4.0. Fetched as wikitext via action=raw.
  pages:
    next: "Opinion_polling_for_the_2026_Spanish_general_election"
    e2023: "Opinion_polling_for_the_2023_Spanish_general_election"
    e2023_2022: "Nationwide_opinion_polling_for_the_2023_Spanish_general_election_(2022)"
    e2023_2019_2021: "Nationwide_opinion_polling_for_the_2023_Spanish_general_election_(2019–2021)"
    e2019nov: "Opinion_polling_for_the_November_2019_Spanish_general_election"
    e2019apr: "Opinion_polling_for_the_April_2019_Spanish_general_election"
    e2016: "Opinion_polling_for_the_2016_Spanish_general_election"

cis:
  # Centro de Investigaciones Sociológicas, cis.es, CC BY 4.0. Official estimates for all
  # cycles; our microdata re-estimate for the current cycle only (not backtested).
  first_month: "2016-01"           # barometers barometro-de-<mes>-<año> from here to the cut-off
  # other studies carrying a general-election estimate, found in the cis.es catalogue (17 Oct 2026)
  extra_studies:
    - preelectoral-elecciones-generales-2016
    - macrobarometro-de-marzo-2019.-preelectoral-elecciones-generales-2019
    - macrobarometro-de-abril-2019.-preelectoral-elecciones-al-parlamento-europeo-autonomicas-y-municipales-2019
    - macrobarometro-de-octubre-2019.-preelectoral-elecciones-generales-2019
    - barometro-de-diciembre-2019.-postelectoral-elecciones-generales-2019
    - macroencuesta-sobre-tendencias-en-voto-municipal.-octubre-2022
    - barometro-de-junio-2023.-postelectoral-elecciones-municipales-y-autonomicas-2023
    - preelectoral-elecciones-generales-2023
    - encuesta-flash-elecciones-generales-2023
    - barometro-de-septiembre-2023.-postelectoral-elecciones-generales-2023
    - encuesta-flash-situacion-politica-espanola
  microdata_from: "2023-07-24"     # re-weighted series starts the day after the 2023 election
  likely_voter_min: 9              # PROBVOTO (0-10) threshold for likely voters
  # FT3273 (Barómetro de febrero 2020) prints "Del 1 al 11 de enero": days kept, month corrected.
  fieldwork_overrides:
    "3273": ["2020-02-01", "2020-02-11"]
